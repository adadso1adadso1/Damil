<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ВОИНСКАЯ ЧАСТЬ</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Courier New', monospace; }
  
  body { 
    background-color: #0a0e17; 
    background-image: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255, 255, 255, 0.03) 2px, rgba(255, 255, 255, 0.03) 4px);
    color: #d1d5db; 
    min-height: 100vh; 
    display: flex; 
    flex-direction: column; 
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .card {
    background: #111827;
    border: 2px solid #4a5d23; 
    border-radius: 8px;
    padding: 20px;
    max-width: 600px;
    width: 100%;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.9);
  }

  .header h1 { 
    color: #8b9a6b; 
    font-size: 18px; 
    letter-spacing: 2px; 
    margin-bottom: 15px;
    text-transform: uppercase;
  }

  /* Фотография внутри рамки */
  .photo-container {
    width: 100%;
    border: 2px solid #374151;
    border-radius: 6px;
    overflow: hidden;
    margin-bottom: 20px;
    background: #000;
  }
  .photo-container img {
    width: 100%;
    height: auto;
    display: block;
  }

  .header h2 { 
    color: #fff; 
    font-size: 20px; 
    margin-bottom: 20px;
    border-bottom: 2px dashed #4a5d23;
    padding-bottom: 15px;
  }

  .buttons {
    display: flex;
    gap: 15px;
    justify-content: center;
    margin-bottom: 20px;
  }

  .btn {
    padding: 12px 24px;
    font-size: 15px;
    font-weight: bold;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    text-transform: uppercase;
    transition: 0.2s;
    font-family: 'Courier New', monospace;
    flex: 1;
  }

  .btn-danger {
    background-color: #991b1b;
    color: white;
    border: 2px solid #ef4444;
  }
  .btn-danger:hover { background-color: #ef4444; }

  .btn-success {
    background-color: #14532d;
    color: white;
    border: 2px solid #22c55e;
  }
  .btn-success:hover { background-color: #22c55e; }

  .result-screen {
    display: none;
    padding: 20px;
    border-radius: 6px;
    margin-bottom: 15px;
    animation: fadeIn 0.4s ease-in-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: scale(0.9); }
    to { opacity: 1; transform: scale(1); }
  }

  .result-danger {
    background: rgba(153, 27, 27, 0.3);
    border: 2px solid #ef4444;
  }
  .result-danger h2 {
    color: #ef4444;
    font-size: 30px;
    margin: 0;
    letter-spacing: 3px;
  }

  .result-success {
    background: rgba(20, 83, 45, 0.3);
    border: 2px solid #22c55e;
  }
  .result-success h2 {
    color: #22c55e;
    font-size: 18px;
    margin: 0;
  }

  .btn-reset {
    background: #374151;
    color: #fff;
    border: 1px solid #6b7280;
    padding: 8px 16px;
    font-size: 13px;
    border-radius: 5px;
    cursor: pointer;
    display: none;
    margin: 0 auto;
  }
  .btn-reset:hover { background: #4b5563; }

</style>
</head>
<body>

  <div class="card">
    
    <div class="header">
      <h1>ВОИНСКАЯ ЧАСТЬ</h1>
    </div>

    <div class="photo-container">
      <img src="Screenshot_2026-11-28-22-37-11-167_com.launcher.brgame.jpg" alt="Военные">
    </div>

    <div id="mainScreen">
      <div class="header">
        <h2>УВЕЗТИ ЛИ ИХ В ТЦК?</h2>
      </div>

      <div class="buttons">
        <button class="btn btn-danger" onclick="makeChoice('danger')">УВЕЗТИ</button>
        <button class="btn btn-success" onclick="makeChoice('success')">ОСТАВИТЬ</button>
      </div>
    </div>

    <div id="resultDanger" class="result-screen result-danger">
      <h2>ГРУЗ 200</h2>
    </div>

    <div id="resultSuccess" class="result-screen result-success">
      <h2>МОЛОДЕЦ!<br>ТЫ ОСТАВИЛ МОЛОДЫХ БОЙЦОВ</h2>
    </div>

    <button class="btn-reset" id="resetBtn" onclick="resetGame()">Вернуться назад</button>

  </div>

<script>
  function makeChoice(type) {
    document.getElementById('mainScreen').style.display = 'none';
    
    if (type === 'danger') {
      document.getElementById('resultDanger').style.display = 'block';
    } else if (type === 'success') {
      document.getElementById('resultSuccess').style.display = 'block';
    }

    document.getElementById('resetBtn').style.display = 'block';
  }

  function resetGame() {
    document.getElementById('resultDanger').style.display = 'none';
    document.getElementById('resultSuccess').style.display = 'none';
    document.getElementById('resetBtn').style.display = 'none';
    
    document.getElementById('mainScreen').style.display = 'block';
  }
</script>

</body>
</html>
