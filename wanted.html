<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>БАЗА ПРОПАВШИХ | МВД</title>
<style>
  body { 
    background-color: #0a0e17; 
    color: #fff; 
    font-family: 'Courier New', monospace; 
    padding: 20px; 
    display: flex; 
    flex-direction: column; 
    align-items: center;
    margin: 0;
  }

  .header { text-align: center; margin-bottom: 20px; }
  .header h1 { font-size: 20px; letter-spacing: 2px; margin: 0; }
  .header p { color: #fbbf24; font-size: 12px; font-weight: bold; margin-top: 5px; }

  .card {
    background: #111827; 
    border: 2px solid #374151; 
    border-radius: 8px;
    width: 100%; 
    max-width: 500px; 
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,0.8);
  }

  .top-bar {
    background: #d97706; 
    color: #fff; 
    text-align: center;
    padding: 12px; 
    font-size: 18px; 
    font-weight: bold; 
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  .photo-container { width: 100%; background: #000; }
  .photo-container img { width: 100%; display: block; height: auto; }

  .info-block { padding: 20px; }
  
  .info-row {
    display: flex; 
    justify-content: space-between; 
    border-bottom: 1px dashed #374151; 
    padding: 10px 0;
    font-size: 14px;
  }
  
  .info-label { color: #9ca3af; }
  
  .info-value { 
    color: #fff; 
    font-weight: bold; 
    background: rgba(255,255,255,0.1);
    padding: 2px 6px; 
    border-radius: 4px;
  }
  
  .danger { color: #ef4444; }
  .warning { color: #fbbf24; }

  /* Блок с наградой */
  .reward {
    background: #1f2937; 
    border-top: 2px solid #374151; 
    text-align: center; 
    padding: 20px;
  }
  .reward p { 
    font-size: 12px; 
    color: #9ca3af; 
    margin: 0 0 8px 0;
    text-transform: uppercase;
  }
  .reward h2 { 
    color: #fbbf24; 
    font-size: 24px; 
    margin: 0;
    text-shadow: 0 0 10px rgba(251, 191, 36, 0.4); /* Свечение */
  }
</style>
</head>
<body>

  <div class="header">
    <h1>МВД ПО РЕСПУБЛИКЕ</h1>
    <p>БАЗА ПРОПАВШИХ БЕЗ ВЕСТИ</p>
  </div>

  <div class="card">
    <div class="top-bar">ПРОПАЛ БЕЗ ВЕСТИ</div>
    
    <div class="photo-container">
      <img src="Screenshot_2026-11-28-23-53-25-849_com.launcher.brgame.jpg" alt="Фото пропавшего">
    </div>

    <div class="info-block">
      <div class="info-row">
        <span class="info-label">ФИО / Никнейм:</span>
        <span class="info-value">Ivan_Sahipov [970]</span>
      </div>
      
      <div class="info-row">
        <span class="info-label">Статус:</span>
        <span class="info-value warning">ПРОПАЛ БЕЗ ВЕСТИ</span>
      </div>
      
      <div class="info-row">
        <span class="info-label">Дата пропажи:</span>
        <span class="info-value">28.11.2026</span>
      </div>
      
      <div class="info-row">
        <span class="info-label">Был одет:</span>
        <span class="info-value">Черная куртка, очки</span>
      </div>
      
      <div class="info-row">
        <span class="info-label">Место пропажи:</span>
        <span class="info-value">г. Пенза</span>
      </div>
    </div>

    <!-- Тут изменено вознаграждение -->
    <div class="reward">
      <p>НАГРАДА ЗА ИНФОРМАЦИЮ:</p>
      <h2>ЗА СПАСИБО</h2>
    </div>
  </div>

</body>
</html>
