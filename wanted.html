<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ВОИНСКАЯ ЧАСТЬ</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Courier New', monospace; }
  
  body { 
    background-color: #1a1e12; 
    background-image: linear-gradient(rgba(10, 14, 5, 0.8), rgba(10, 14, 5, 0.9)), url('Screenshot_2026-11-28-22-37-11-167_com.launcher.brgame.jpg');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    color: #d1d5db; 
    min-height: 100vh; 
    display: flex; 
    flex-direction: column; 
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .container {
    background: rgba(20, 25, 15, 0.9);
    border: 2px solid #4a5d23; 
    border-radius: 8px;
    padding: 30px;
    max-width: 600px;
    width: 100%;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.9);
    backdrop-filter: blur(5px);
  }

  .header h1 { 
    color: #8b9a6b; 
    font-size: 20px; 
    letter-spacing: 2px; 
    margin-bottom: 10px;
    text-transform: uppercase;
  }
  
  .header h2 { 
    color: #fff; 
    font-size: 22px; 
    margin-bottom: 30px;
    border-bottom: 2px dashed #4a5d23;
    padding-bottom: 15px;
  }

  .buttons {
    display: flex;
    gap: 20px;
    justify-content: center;
    margin-bottom: 30px;
  }

  .btn {
    padding: 15px 30px;
    font-size: 16px;
    font-weight: bold;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    text-transform: uppercase;
    transition: 0.2s;
    font-family: 'Courier New', monospace;
  }

  .btn-danger {
    background-color: #991b1b;
    color: white;
    border: 2px solid #ef4444;
  }
  .btn-danger:hover { background-color: #ef4444; transform: scale(1.05); }

  .btn-success {
    background-color: #14532d;
    color: white;
    border: 2px solid #22c55e;
  }
  .btn-success:hover { background-color: #22c55e; transform: scale(1.05); }

  .result-screen {
    display: none;
    padding: 30px;
    border-radius: 8px;
    margin-bottom: 20px;
    animation: fadeIn 0.5s ease-in-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: scale(0.9); }
    to { opacity: 1; transform: scale(1); }
  }

  .result-danger {
    background: rgba(153, 27, 27, 0.3);
    border: 2px solid #ef4444;
  }
  .result-danger h2 {
    color: #ef4444;
    font-size: 40px;
    text-shadow: 0 0 15px rgba(239, 68, 68, 0.8);
    margin: 0;
    letter-spacing: 5px;
  }

  .result-success {
    background: rgba(20, 83, 45, 0.3);
    border: 2px solid #22c55e;
  }
  .result-success h2 {
    color: #22c55e;
    font-size: 24px;
    text-shadow: 0 0 10px rgba(34, 197, 94, 0.6);
    margin: 0;
  }

  .btn-reset {
    background: #374151;
    color: #fff;
    border: 1px solid #6b7280;
    padding: 10px 20px;
    font-size: 14px;
    margin-top: 15px;
    border-radius: 5px;
    cursor: pointer;
  }
  .btn-reset:hover { background: #4b5563; }

</style>
</head>
<body>

  <div class="container">
    
    <div id="mainScreen">
      <div class="header">
        <h1>ВОИНСКАЯ ЧАСТЬ</h1>
        <h2>УВЕЗТИ ЛИ ИХ В ТЦК?</h2>
      </div>

      <div class="buttons">
        <button class="btn btn-danger" onclick="makeChoice('danger')">УВЕЗТИ</button>
        <button class="btn btn-success" onclick="makeChoice('success')">ОСТАВИТЬ</button>
      </div>
    </div>

    <div id="resultDanger" class="result-screen result-danger">
      <h2>ГРУЗ 200</h2>
    </div>

    <div id="resultSuccess" class="result-screen result-success">
      <h2>МОЛОДЕЦ!<br>ТЫ ОСТАВИЛ МОЛОДЫХ БОЙЦОВ</h2>
    </div>

    <div id="resetArea" style="display:none;">
      <button class="btn-reset" onclick="resetGame()">Вернуться назад</button>
    </div>

  </div>

<script>
  function makeChoice(type) {
    document.getElementById('mainScreen').style.display = 'none';
    
    if (type === 'danger') {
      document.getElementById('resultDanger').style.display = 'block';
    } else if (type === 'success') {
      document.getElementById('resultSuccess').style.display = 'block';
    }

    document.getElementById('resetArea').style.display = 'block';
  }

  function resetGame() {
    document.getElementById('resultDanger').style.display = 'none';
    document.getElementById('resultSuccess').style.display = 'none';
    document.getElementById('resetArea').style.display = 'none';
    
    document.getElementById('mainScreen').style.display = 'block';
  }
</script>

</body>
</html>
