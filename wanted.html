<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>РОЗЫСК | МВД</title>
<style>
  body { 
    background-color: #0a0e17; 
    color: #fff; 
    font-family: 'Courier New', monospace; 
    padding: 20px; 
    display: flex; 
    flex-direction: column; 
    align-items: center;
    margin: 0;
  }

  .header { text-align: center; margin-bottom: 20px; }
  .header h1 { font-size: 20px; letter-spacing: 2px; margin: 0; }
  .header p { color: #ef4444; font-size: 12px; font-weight: bold; margin-top: 5px; }

  .card {
    background: #111827; 
    border: 2px solid #374151; 
    border-radius: 8px;
    width: 100%; 
    max-width: 500px; 
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,0.8);
  }

  .top-bar {
    background: #991b1b; 
    color: #fff; 
    text-align: center;
    padding: 12px; 
    font-size: 18px; 
    font-weight: bold; 
    letter-spacing: 3px;
  }

  .photo-container { width: 100%; background: #000; }
  .photo-container img { width: 100%; display: block; height: auto; }

  .info-block { padding: 20px; }
  
  .info-row {
    display: flex; 
    justify-content: space-between; 
    border-bottom: 1px dashed #374151; 
    padding: 10px 0;
    font-size: 14px;
  }
  
  .info-label { color: #9ca3af; }
  
  .info-value { 
    color: #fff; 
    font-weight: bold; 
    background: rgba(255,255,255,0.1);
    padding: 2px 6px; 
    border-radius: 4px;
  }
  
  .danger { color: #ef4444; }

  .reward {
    background: #1f2937; 
    border-top: 2px solid #374151; 
    text-align: center; 
    padding: 15px;
  }
  .reward h2 { color: #fbbf24; font-size: 22px; margin: 5px 0 0 0; }
  .reward p { font-size: 11px; color: #9ca3af; margin: 0; }
</style>
</head>
<body>

  <div class="header">
    <h1>МВД ПО РЕСПУБЛИКЕ</h1>
    <p>ОФИЦИАЛЬНАЯ БАЗА РОЗЫСКА</p>
  </div>

  <div class="card">
    <div class="top-bar">РОЗЫСКИВАЕТСЯ</div>
    
    <div class="photo-container">
      <img src="Screenshot_2026-11-28-22-37-29-737_com.launcher.brgame.jpg" alt="Фото подозреваемого">
    </div>

    <div class="info-block">
      <div class="info-row">
        <span class="info-label">Позывной / ФИО:</span>
        <span class="info-value">Damil (Добр)</span>
      </div>
      
      <div class="info-row">
        <span class="info-label">Статус:</span>
        <span class="info-value danger">В БЕГАХ</span>
      </div>
      
      <div class="info-row">
        <span class="info-label">Статья:</span>
        <span class="info-value">Ст. 228 УК РФ</span>
      </div>
      
      <div class="info-row">
        <span class="info-label">Особые приметы:</span>
        <span class="info-value">Форма МВД</span>
      </div>
      
      <div class="info-row">
        <span class="info-label">Опасность:</span>
        <span class="info-value danger">ВООРУЖЕН</span>
      </div>
    </div>

    <div class="reward">
      <p>ВОЗНАГРАЖДЕНИЕ ЗА ИНФОРМАЦИЮ:</p>
      <h2>500,000 РУБ.</h2>
    </div>
  </div>

</body>
</html>
