<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мой Спортзал</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Arial,sans-serif; }
  
  body { 
    background-color: #0a0a0c;
    background-image: linear-gradient(rgba(10, 10, 12, 0.9), rgba(10, 10, 12, 0.95)), url('https://images.unsplash.com/photo-1534438327276-14e5300c3a48?q=80&w=1470&auto=format&fit=crop');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    color:#fff; 
    min-height:100vh; 
    padding: 20px 0 80px 0; 
  }
  
  .container { max-width: 600px; margin:0 auto; padding:0 16px; }

  .header { text-align: center; margin-bottom: 24px; }
  .header h1 { font-size: 26px; color: #fff; text-transform: uppercase; letter-spacing: 2px; font-weight: 800; }
  .header h1 span { color: #ff1a1a; }
  .header p { font-size: 13px; color: #888; margin-top: 6px; }

  .btn-main {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; padding: 16px; border: none; border-radius: 12px;
    font-size: 16px; font-weight: 700; color: #fff; cursor: pointer; transition: 0.2s;
    background: linear-gradient(135deg, #ff1a1a, #aa0000);
    box-shadow: 0 4px 15px rgba(255,26,26,0.4); margin-bottom: 24px;
  }
  .btn-main:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(255,26,26,0.6); }

  .empty-state { text-align: center; padding: 40px 20px; background: rgba(255,255,255,0.03); border-radius: 16px; border: 1px dashed rgba(255,255,255,0.1); }
  .empty-state h2 { font-size: 18px; margin-bottom: 10px; color: #ccc; }
  .empty-state p { font-size: 14px; color: #666; }

  .day-card {
    background: rgba(20, 20, 24, 0.85);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.08); 
    border-radius: 16px; margin-bottom: 16px; overflow: hidden;
    box-shadow: 0 8px 25px rgba(0,0,0,0.8);
  }
  .day-header {
    background: rgba(30, 30, 35, 0.6); 
    padding: 16px 18px; display: flex; justify-content: space-between; align-items: center;
  }
  .day-title { font-size: 16px; color: #fff; font-weight: 700; letter-spacing: 1px; display: flex; align-items: center; gap: 10px; cursor: pointer; }
  .day-actions { display: flex; gap: 12px; }
  .icon-btn { background: none; border: none; cursor: pointer; font-size: 18px; color: #888; transition: 0.2s; }
  .icon-btn:hover { color: #ff1a1a; transform: scale(1.1); }
  
  .day-content { padding: 10px 18px 18px 18px; display: none; }
  .day-card.open .day-content { display: block; }

  .exercise {
    display: flex; align-items: center; padding: 14px 0; 
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .exercise:last-child { border-bottom: none; }
  
  .exercise input[type="checkbox"] {
    appearance: none; -webkit-appearance: none;
    width: 24px; height: 24px; border: 2px solid #444; border-radius: 8px;
    margin-right: 14px; cursor: pointer; position: relative; flex-shrink: 0; transition: 0.2s; background: #111;
  }
  .exercise input[type="checkbox"]:checked { background: #ff1a1a; border-color: #ff1a1a; box-shadow: 0 0 12px rgba(255,26,26,0.8); }
  .exercise input[type="checkbox"]:checked::after {
    content: '✓'; position: absolute; color: #fff; font-size: 16px; font-weight: bold;
    top: 50%; left: 50%; transform: translate(-50%,-50%);
  }
  
  .exercise-info { flex-grow: 1; cursor: pointer; }
  .exercise-name { font-size: 15px; color: #eee; font-weight: 500; }
  .exercise-sets { font-size: 13px; color: #ff4d4d; font-weight: 600; margin-top: 4px; }
  .exercise-info.checked .exercise-name { color: #666; text-decoration: line-through; }
  
  .delete-ex { background: none; border: none; color: #555; cursor: pointer; font-size: 18px; padding: 8px; transition: 0.2s; }
  .delete-ex:hover { color: #ff1a1a; }

  .btn-add-ex { background: rgba(255,255,255,0.05); color: #ccc; border: 1px dashed rgba(255,255,255,0.2); width: 100%; padding: 12px; border-radius: 10px; margin-top: 15px; cursor: pointer; font-weight: 600; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .btn-add-ex:hover { background: rgba(255,255,255,0.1); color: #fff; }

  .modal {
    display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.85); z-index: 100; justify-content: center; align-items: center;
    backdrop-filter: blur(8px);
  }
  .modal.open { display: flex; }
  .modal-content {
    background: #151518; padding: 24px; border-radius: 20px; width: 90%; max-width: 400px;
    border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 20px 40px rgba(0,0,0,0.9);
  }
  .modal-content h3 { color: #fff; margin-bottom: 20px; text-align: center; font-size: 20px; display: flex; align-items: center; justify-content: center; gap: 10px; }
  .modal-content input {
    width: 100%; padding: 14px; margin-bottom: 12px; border-radius: 10px;
    border: 1px solid #333; background: #0a0a0c; color: #fff; font-size: 15px; outline: none; transition: 0.2s;
  }
  .modal-content input:focus { border-color: #ff1a1a; box-shadow: 0 0 10px rgba(255,26,26,0.2); }
  .modal-actions { display: flex; gap: 10px; margin-top: 15px; }
  .modal-actions button { flex: 1; padding: 14px; border-radius: 10px; font-weight: 700; cursor: pointer; border: none; font-size: 15px; transition: 0.2s; }
  .btn-cancel { background: #333; color: #fff; }
  .btn-cancel:hover { background: #444; }
  .btn-save { background: #ff1a1a; color: #fff; }
  .btn-save:hover { background: #cc0000; }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>MY <span>GYM</span></h1>
    <p>Создай свой идеальный график</p>
  </div>

  <button class="btn-main" onclick="openDayModal()">
    <span>➕</span> Добавить тренировочный день
  </button>

  <div id="scheduleList"></div>
</div>

<div class="modal" id="dayModal">
  <div class="modal-content">
    <h3>📅 Новый день</h3>
    <input type="text" id="dayNameInput" placeholder="Например: День Груди, Ноги, Понедельник...">
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('dayModal')">Отмена</button>
      <button class="btn-save" onclick="saveDay()">Создать</button>
    </div>
  </div>
</div>

<div class="modal" id="exModal">
  <div class="modal-content">
    <h3>🏋️ Новое упражнение</h3>
    <input type="text" id="exNameInput" placeholder="Название (Жим штанги лёжа)">
    <input type="text" id="exSetsInput" placeholder="Подходы и повторения (4х10 или 3 подхода)">
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('exModal')">Отмена</button>
      <button class="btn-save" onclick="saveExercise()">Добавить</button>
    </div>
  </div>
</div>

<script>
  let schedule = JSON.parse(localStorage.getItem('myPersonalGym')) || [];
  let currentDayId = null;

  function saveData() {
    localStorage.setItem('myPersonalGym', JSON.stringify(schedule));
    render();
  }

  function render() {
    const list = document.getElementById('scheduleList');
    
    if (schedule.length === 0) {
      list.innerHTML = `
        <div class="empty-state">
          <h2>Здесь пока пусто 🏜️</h2>
          <p>Нажми на кнопку выше, чтобы создать свой первый день тренировок!</p>
        </div>
      `;
      return;
    }

    list.innerHTML = schedule.map(day => `
      <div class="day-card open">
        <div class="day-header">
          <div class="day-title" onclick="toggleDay(this)">
            <span>📅</span> ${day.name}
          </div>
          <div class="day-actions">
            <button class="icon-btn" onclick="deleteDay(${day.id})" title="Удалить день">🗑️</button>
          </div>
        </div>
        <div class="day-content">
          ${day.exercises.length === 0 ? '<p style="color:#666; font-size:14px; text-align:center; margin: 10px 0;">Нет упражнений. Добавь первое!</p>' : ''}
          ${day.exercises.map(ex => `
            <div class="exercise">
              <input type="checkbox" ${ex.checked ? 'checked' : ''} onchange="toggleEx(${day.id}, ${ex.id}, this)">
              <div class="exercise-info ${ex.checked ? 'checked' : ''}" onclick="toggleEx(${day.id}, ${ex.id}, this.previousElementSibling)">
                <div class="exercise-name">${ex.name}</div>
                <div class="exercise-sets">${ex.sets}</div>
              </div>
              <button class="delete-ex" onclick="deleteEx(${day.id}, ${ex.id})">✕</button>
            </div>
          `).join('')}
          <button class="btn-add-ex" onclick="openExModal(${day.id})">
            <span>➕</span> Добавить упражнение
          </button>
        </div>
      </div>
    `).join('');
  }

  function toggleDay(el) {
    const card = el.closest('.day-card');
    card.classList.toggle('open');
  }

  function openDayModal() {
    document.getElementById('dayNameInput').value = '';
    document.getElementById('dayModal').classList.add('open');
  }
  
  function openExModal(dayId) {
    currentDayId = dayId;
    document.getElementById('exNameInput').value = '';
    document.getElementById('exSetsInput').value = '';
    document.getElementById('exModal').classList.add('open');
  }
  
  function closeModal(id) {
    document.getElementById(id).classList.remove('open');
  }

  function saveDay() {
    const name = document.getElementById('dayNameInput').value.trim();
    if (!name) return alert('Введите название дня!');
    schedule.push({ id: Date.now(), name: name, exercises: [] });
    saveData();
    closeModal('dayModal');
  }

  function saveExercise() {
    const name = document.getElementById('exNameInput').value.trim();
    const sets = document.getElementById('exSetsInput').value.trim();
    if (!name || !sets) return alert('Заполните оба поля!');
    
    const day = schedule.find(d => d.id === currentDayId);
    day.exercises.push({ id: Date.now(), name: name, sets: sets, checked: false });
    saveData();
    closeModal('exModal');
  }

  function deleteDay(id) {
    if(confirm('Удалить этот день полностью?')) {
      schedule = schedule.filter(d => d.id !== id);
      saveData();
    }
  }

  function deleteEx(dayId, exId) {
    if(confirm('Удалить упражнение?')) {
      const day = schedule.find(d => d.id === dayId);
      day.exercises = day.exercises.filter(e => e.id !== exId);
      saveData();
    }
  }

  function toggleEx(dayId, exId, checkbox) {
    const day = schedule.find(d => d.id === dayId);
    const ex = day.exercises.find(e => e.id === exId);
    ex.checked = !ex.checked;
    checkbox.checked = ex.checked;
    saveData();
  }

  render();
</script>
</body>
  </html>
