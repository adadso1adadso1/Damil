<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>График</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Arial,sans-serif; }
  
  body { 
    background-color: #050505;
    background-image: linear-gradient(rgba(5, 5, 5, 0.85), rgba(5, 5, 5, 0.95)), url('https://images.unsplash.com/photo-1534438327276-14e5300c3a48?q=80&w=1470&auto=format&fit=crop');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    color:#e0e0e0; 
    min-height:100vh; 
    padding: 20px 0 40px 0; 
  }
  
  .container { max-width:700px; margin:0 auto; padding:0 16px; }

  .day-card {
    background: rgba(21, 21, 21, 0.85);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 255, 255, 0.1); 
    border-radius:12px;
    margin-bottom:16px; overflow:hidden;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
  }
  
  .day-header {
    background: rgba(30, 30, 30, 0.6); 
    padding:14px 18px; display:flex; justify-content:space-between; align-items:center;
    cursor:pointer; border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  
  .day-header h2 { font-size:16px; color:#fff; letter-spacing:1px; }
  .day-header .arrow { transition:0.3s; color:#888; font-size:18px; }
  .day-card.open .day-header .arrow { transform:rotate(180deg); }

  .day-content { display:none; padding:10px 18px; }
  .day-card.open .day-content { display:block; }

  .rest-day .day-header { justify-content:center; cursor:default; background:rgba(10,10,10,0.8); }
  .rest-day h2 { color:#888; font-size:14px; }

  .exercise {
    display:flex; align-items:center; padding:12px 0; 
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .exercise:last-child { border-bottom:none; }
  
  .exercise input[type="checkbox"] {
    appearance:none; -webkit-appearance:none;
    width:22px; height:22px; border:2px solid #555; border-radius:6px;
    margin-right:14px; cursor:pointer; position:relative; flex-shrink:0; transition:0.2s;
    background: rgba(0,0,0,0.3);
  }
  .exercise input[type="checkbox"]:checked { background:#ff1a1a; border-color:#ff1a1a; box-shadow: 0 0 10px rgba(255,26,26,0.6); }
  .exercise input[type="checkbox"]:checked::after {
    content:'✓'; position:absolute; color:#fff; font-size:14px; font-weight:bold;
    top:50%; left:50%; transform:translate(-50%,-50%);
  }
  
  .exercise-info { flex-grow:1; }
  .exercise-name { font-size:14px; color:#ddd; font-weight: 500; text-shadow: 0 1px 2px rgba(0,0,0,0.8); transition:0.2s; }
  .exercise-info.checked .exercise-name { color:#777; text-decoration:line-through; text-shadow: none; }
  .exercise-sets { font-size:12px; color:#ff4d4d; font-weight:600; margin-top:4px; }
</style>
</head>
<body>

<div class="container">

  <div class="day-card open">
    <div class="day-header" onclick="toggleDay(this)">
      <h2>ПОНЕДЕЛЬНИК</h2>
      <div class="arrow">▼</div>
    </div>
    <div class="day-content">
      <label class="exercise">
        <input type="checkbox" onchange="toggleEx(this)">
        <div class="exercise-info">
          <div class="exercise-name">Жим штанги лёжа</div>
          <div class="exercise-sets">3×8–10</div>
        </div>
      </label>
      <label class="exercise">
        <input type="checkbox" onchange="toggleEx(this)">
        <div class="exercise-info">
          <div class="exercise-name">Жим гантелей на наклонной скамье</div>
          <div class="exercise-sets">2×10</div>
        </div>
      </label>
      <label class="exercise">
        <input type="checkbox" onchange="toggleEx(this)">
        <div class="exercise-info">
          <div class="exercise-name">Подъёмы гантелей в стороны</div>
          <div class="exercise-sets">3×12</div>
        </div>
      </label>
      <label class="exercise">
        <input type="checkbox" onchange="toggleEx(this)">
        <div class="exercise-info">
          <div class="exercise-name">Разгибание рук на верхнем блоке</div>
          <div class="exercise-sets">3×12</div>
        </div>
      </label>
      <label class="exercise">
        <input type="checkbox" onchange="toggleEx(this)">
        <div class="exercise-info">
          <div class="exercise-name">Отжимания от пола</div>
          <div class="exercise-sets">2 подхода без отказа</div>
        </div>
      </label>
    </div>
  </div>

  <div class="day-card">
    <div class="day-header" onclick="toggleDay(this)">
      <h2>ВТОРНИК</h2>
      <div class="arrow">▼</div>
    </div>
    <div class="day-content">
      <label class="exercise">
        <input type="checkbox" onchange="toggleEx(this)">
        <div class="exercise-info">
          <div class="exercise-name">Приседания с гантелью</div>
          <div class="exercise-sets">3×10</div>
        </div>
      </label>
      <label class="exercise">
        <input type="checkbox" onchange="toggleEx(this)">
        <div class="exercise-info">
          <div class="exercise-name">Разгибание ног в тренажёре</div>
          <div class="exercise-sets">3×12</div>
        </div>
      </label>
      <label class="exercise">
        <input type="checkbox" onchange="toggleEx(this)">
        <div class="exercise-info">
          <div class="exercise-name">Сгибание ног в тренажёре</div>
          <div class="exercise-sets">3×12</div>
        </div>
      </label>
      <label class="exercise">
        <input type="checkbox" onchange="toggleEx(this)">
        <div class="exercise-info">
          <div class="exercise-name">Подъёмы на носки</div>
          <div class="exercise-sets">3×15</div>
        </div>
      </label>
      <label class="exercise">
        <input type="checkbox" onchange="toggleEx(this)">
        <div class="exercise-info">
          <div class="exercise-name">Планка</div>
          <div class="exercise-sets">3×30 секунд</div>
        </div>
      </label>
    </div>
  </div>

  <div class="day-card rest-day">
    <div class="day-header">
      <h2>СРЕДА — ОТДЫХ</h2>
    </div>
  </div>

  <div class="day-card">
    <div class="day-header" onclick="toggleDay(this)">
      <h2>ЧЕТВЕРГ</h2>
      <div class="arrow">▼</div>
    </div>
    <div class="day-content">
      <label class="exercise">
        <input type="checkbox" onchange="toggleEx(this)">
        <div class="exercise-info">
          <div class="exercise-name">Подтягивания</div>
          <div class="exercise-sets">3×3–6</div>
        </div>
      </label>
      <label class="exercise">
        <input type="checkbox" onchange="toggleEx(this)">
        <div class="exercise-info">
          <div class="exercise-name">Пуловер на верхнем блоке прямыми руками</div>
          <div class="exercise-sets">3×12</div>
        </div>
      </label>
      <label class="exercise">
        <input type="checkbox" onchange="toggleEx(this)">
        <div class="exercise-info">
          <div class="exercise-name">Face Pull (тяга каната к лицу)</div>
          <div class="exercise-sets">2×12–15</div>
        </div>
      </label>
      <label class="exercise">
        <input type="checkbox" onchange="toggleEx(this)">
        <div class="exercise-info">
          <div class="exercise-name">Сгибания рук со штангой EZ</div>
          <div class="exercise-sets">3×10</div>
        </div>
      </label>
      <label class="exercise">
        <input type="checkbox" onchange="toggleEx(this)">
        <div class="exercise-info">
          <div class="exercise-name">Паучьи сгибания с гантелями</div>
          <div class="exercise-sets">2×12</div>
        </div>
      </label>
    </div>
  </div>

  <div class="day-card">
    <div class="day-header" onclick="toggleDay(this)">
      <h2>ПЯТНИЦА</h2>
      <div class="arrow">▼</div>
    </div>
    <div class="day-content">
      <label class="exercise">
        <input type="checkbox" onchange="toggleEx(this)">
        <div class="exercise-info">
          <div class="exercise-name">Приседания с гантелью</div>
          <div class="exercise-sets">3×10</div>
        </div>
      </label>
      <label class="exercise">
        <input type="checkbox" onchange="toggleEx(this)">
        <div class="exercise-info">
          <div class="exercise-name">Сгибание ног в тренажёре</div>
          <div class="exercise-sets">3×12</div>
        </div>
      </label>
      <label class="exercise">
        <input type="checkbox" onchange="toggleEx(this)">
        <div class="exercise-info">
          <div class="exercise-name">Разгибание ног в тренажёре</div>
          <div class="exercise-sets">3×12</div>
        </div>
      </label>
      <label class="exercise">
        <input type="checkbox" onchange="toggleEx(this)">
        <div class="exercise-info">
          <div class="exercise-name">Подъёмы на носки</div>
          <div class="exercise-sets">3×15</div>
        </div>
      </label>
    </div>
  </div>

  <div class="day-card rest-day">
    <div class="day-header">
      <h2>СУББОТА — ОТДЫХ</h2>
    </div>
  </div>

  <div class="day-card rest-day">
    <div class="day-header">
      <h2>ВОСКРЕСЕНЬЕ — ОТДЫХ</h2>
    </div>
  </div>

</div>

<script>
  function toggleDay(header) {
    const card = header.parentElement;
    card.classList.toggle('open');
  }

  function toggleEx(checkbox) {
    const info = checkbox.nextElementSibling;
    if(checkbox.checked) {
      info.classList.add('checked');
    } else {
      info.classList.remove('checked');
    }
    saveProgress();
  }

  function saveProgress() {
    const checkboxes = document.querySelectorAll('input[type="checkbox"]');
    const states = Array.from(checkboxes).map(cb => cb.checked);
    localStorage.setItem('gymProgress', JSON.stringify(states));
  }

  function loadProgress() {
    const saved = localStorage.getItem('gymProgress');
    if(!saved) return;
    const states = JSON.parse(saved);
    const checkboxes = document.querySelectorAll('input[type="checkbox"]');
    
    checkboxes.forEach((cb, index) => {
      if(states[index]) {
        cb.checked = true;
        cb.nextElementSibling.classList.add('checked');
      }
    });
  }

  loadProgress();
</script>
</body>
  </html>
