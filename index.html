<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BR FORUM</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
  body{background:#0d0d12;color:#e6e6f0;min-height:100vh}
  a{color:#b06cff;text-decoration:none}
  header{background:linear-gradient(90deg,#1a0f2e,#0d0d12);border-bottom:2px solid #7a3cff;
    padding:14px 24px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:10;
    box-shadow:0 0 20px rgba(122,60,255,.4)}
  .logo{font-weight:800;font-size:22px;letter-spacing:1px;
    background:linear-gradient(90deg,#b06cff,#ff4d9d);-webkit-background-clip:text;background-clip:text;color:transparent}
  nav{display:flex;gap:18px;margin-left:auto;font-size:14px}
  nav a:hover{color:#ff4d9d}
  .container{max-width:1000px;margin:0 auto;padding:24px}
  .hero{text-align:center;padding:36px 16px;background:radial-gradient(circle at 50% 0%,rgba(122,60,255,.25),transparent 70%);border-radius:14px;margin-bottom:24px}
  .hero h1{font-size:34px;margin-bottom:8px;background:linear-gradient(90deg,#b06cff,#ff4d9d);-webkit-background-clip:text;background-clip:text;color:transparent}
  .hero p{color:#9a9ab0}
  .sections{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
  .card{background:#15151f;border:1px solid #26263a;border-radius:12px;padding:18px;cursor:pointer;transition:.2s}
  .card:hover{border-color:#7a3cff;transform:translateY(-3px);box-shadow:0 6px 20px rgba(122,60,255,.25)}
  .card h3{color:#fff;margin-bottom:6px}
  .card p{color:#8a8aa0;font-size:13px}
  .back{display:inline-block;margin-bottom:16px;color:#9a9ab0;cursor:pointer}
  .back:hover{color:#b06cff}
  .topic{background:#15151f;border:1px solid #26263a;border-radius:10px;padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:.2s}
  .topic:hover{border-color:#7a3cff}
  .topic h4{color:#e6e6f0;margin-bottom:4px}
  .topic small{color:#7a7a90}
  .btn{background:linear-gradient(90deg,#7a3cff,#ff4d9d);color:#fff;border:none;padding:10px 20px;border-radius:8px;font-weight:600;cursor:pointer;transition:.2s}
  .btn:hover{opacity:.85}
  input,textarea{width:100%;background:#0d0d12;border:1px solid #2a2a3f;color:#e6e6f0;padding:10px 12px;border-radius:8px;font-size:14px;margin-bottom:10px;outline:none}
  input:focus,textarea:focus{border-color:#7a3cff}
  .post{background:#15151f;border:1px solid #26263a;border-radius:10px;padding:12px 16px;margin-bottom:10px}
  .post .author{color:#b06cff;font-weight:600;font-size:13px}
  .post .date{color:#6a6a80;font-size:11px;margin-left:8px}
  .post p{margin-top:6px;color:#d0d0e0;font-size:14px}
  .hidden{display:none}
  footer{text-align:center;color:#5a5a70;font-size:12px;padding:24px}
</style>
</head>
<body>
<header>
  <div class="logo">BR FORUM</div>
  <nav><a href="#" onclick="showSections()">Главная</a><a href="#">Правила</a><a href="#">Войти</a></nav>
</header>

<div class="container">
  <div id="home">
    <div class="hero"><h1>Добро пожаловать на BR Forum</h1><p>Общение, гайды, новости и помощь</p></div>
    <div class="sections" id="sectionList"></div>
  </div>

  <div id="sectionView" class="hidden">
    <span class="back" onclick="showSections()">← Назад к разделам</span>
    <h2 id="sectionTitle" style="margin-bottom:16px;color:#fff"></h2>
    <button class="btn" onclick="openNewTopic()">+ Создать тему</button>
    <div id="topicForm" class="hidden" style="margin:16px 0;background:#15151f;padding:16px;border-radius:12px;border:1px solid #26263a">
      <input id="topicTitle" placeholder="Заголовок темы">
      <textarea id="topicText" rows="3" placeholder="Текст темы..."></textarea>
      <button class="btn" onclick="createTopic()">Опубликовать</button>
    </div>
    <div id="topicList" style="margin-top:16px"></div>
  </div>

  <div id="topicView" class="hidden">
    <span class="back" onclick="backToSection()">← Назад к темам</span>
    <h2 id="topicTitleView" style="margin-bottom:16px;color:#fff"></h2>
    <div id="postList"></div>
    <textarea id="replyText" rows="3" placeholder="Ваш ответ..."></textarea>
    <button class="btn" onclick="sendReply()">Ответить</button>
  </div>
</div>

<footer>© 2024 BR Forum — демо</footer>

<script>
const sections=[
  {id:'news',title:'Новости',desc:'Обновления и анонсы'},
  {id:'guides',title:'Гайды',desc:'Полезные руководства'},
  {id:'help',title:'Помощь',desc:'Вопросы и ответы'},
  {id:'bugs',title:'Баг-репорт',desc:'Ошибки и проблемы'},
  {id:'talk',title:'Общение',desc:'Свободное общение'}
];
let data=JSON.parse(localStorage.getItem('brForum')||'{}');
function save(){localStorage.setItem('brForum',JSON.stringify(data))}
let currentSection=null,currentTopic=null;

function showSections(){
  document.getElementById('home').classList.remove('hidden');
  document.getElementById('sectionView').classList.add('hidden');
  document.getElementById('topicView').classList.add('hidden');
  document.getElementById('sectionList').innerHTML=sections.map(s=>{
    const c=(data[s.id]||[]).length;
    return `<div class="card" onclick="openSection('${s.id}')"><h3>${s.title}</h3><p>${s.desc}</p><small style="color:#7a3cff">Тем: ${c}</small></div>`;
  }).join('');
}

function openSection(id){
  currentSection=id;
  const sec=sections.find(s=>s.id===id);
  document.getElementById('sectionTitle').textContent=sec.title;
  document.getElementById('home').classList.add('hidden');
  document.getElementById('topicView').classList.add('hidden');
  document.getElementById('sectionView').classList.remove('hidden');
  document.getElementById('topicForm').classList.add('hidden');
  renderTopics();
}

function renderTopics(){
  const topics=data[currentSection]||[];
  const list=document.getElementById('topicList');
  if(!topics.length){list.innerHTML='<p style="color:#7a7a90">Пока нет тем. Создайте первую!</p>';return}
  list.innerHTML=topics.map((t,i)=>`<div class="topic" onclick="openTopic(${i})"><h4>${esc(t.title)}</h4><small>${esc(t.author)} · ${t.date} · ответов: ${t.posts.length-1}</small></div>`).join('');
}

function openNewTopic(){document.getElementById('topicForm').classList.toggle('hidden')}
function createTopic(){
  const title=document.getElementById('topicTitle').value.trim();
  const text=document.getElementById('topicText').value.trim();
  if(!title||!text)return alert('Заполните заголовок и текст');
  if(!data[currentSection])data[currentSection]=[];
  data[currentSection].unshift({title,author:'Гость',date:new Date().toLocaleDateString('ru-RU'),posts:[{author:'Гость',text,date:new Date().toLocaleString('ru-RU')}]});
  save();
  document.getElementById('topicTitle').value='';
  document.getElementById('topicText').value='';
  document.getElementById('topicForm').classList.add('hidden');
  renderTopics();
}

function openTopic(i){
  currentTopic=i;
  const t=data[currentSection][i];
  document.getElementById('topicTitleView').textContent=t.title;
  document.getElementById('topicView').classList.remove('hidden');
  document.getElementById('sectionView').classList.add('hidden');
  renderPosts();
}

function renderPosts(){
  const t=data[currentSection][currentTopic];
  document.getElementById('postList').innerHTML=t.posts.map(p=>`<div class="post"><span class="author">${esc(p.author)}</span><span class="date">${p.date}</span><p>${esc(p.text)}</p></div>`).join('');
}

function sendReply(){
  const text=document.getElementById('replyText').value.trim();
  if(!text)return;
  data[currentSection][currentTopic].posts.push({author:'Гость',text,date:new Date().toLocaleString('ru-RU')});
  save();
  document.getElementById('replyText').value='';
  renderPosts();
}

function backToSection(){document.getElementById('topicView').classList.add('hidden');openSection(currentSection)}

function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

showSections();
</script>
</body>
</html>
